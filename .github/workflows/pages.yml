# 테스트를 돌리고 introduce/ 의 weber 사이트를 빌드합니다.
# main 에 올라오면 GitHub Pages 에 배포합니다. (저장소 Settings → Pages → Source: GitHub Actions)
name: 사이트

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 테스트와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: GitHub Pages 배포
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
